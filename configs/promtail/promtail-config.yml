# ==========================================================
# Promtail Log Shipper Configuration - Enterprise NOC Platform
# ==========================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576 # 1MB batch size

scrape_configs:
  # System and Syslog Collector
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          tier: infrastructure
          __path__: /var/log/*.log

  # NOC Application & API Logs
  - job_name: noc-application
    static_configs:
      - targets:
          - localhost
        labels:
          job: noc-apps
          tier: orchestration
          __path__: /var/log/noc/*.log
